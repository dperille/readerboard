name: build
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest  # OS to run this job on
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3  # Set up Docker's build engine
      - uses: docker/login-action@v3  # docker login to registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}  # Whoever triggered the run
          password: ${{ secrets.GITHUB_TOKEN }}  # Provided automatically
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ./app/web-readerboard  # Build context root
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
